# The software factory. Its workspace is the repository it implements issues in.
# Set [workspace].source before the first start. Secrets live in .env, never here.
# Factory settings live in package.yaml.

[models]
recap = "anthropic:claude-sonnet-5"

[workspace]
path = "workspace"
# The repository the factory clones on first start and works in.
# source = "https://github.com/<owner>/<repository>.git"

[workspace.conventions]
enabled = true
# Instruction files the orchestrating model and the standards review read, when they exist.
instructions = ["AGENTS.md"]

[memory]
recap = "every-turn"

[feedback]
# Routine turns have nobody to answer.
ask = "off"

[serve]
# The signal receiver GitHub webhooks reach.
listen = "0.0.0.0:8787"

[budgets]
# One issue should not run past two hours or spend more than this in a day.
seconds = 7200
usd_per_day = 25.0

[prices."anthropic:claude-sonnet-5"]
input = 2.0
output = 10.0
cache_read = 0.2
cache_write = 2.5
